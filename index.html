<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prak 2 Wok</title>
</head>
<body>
    <div style="background-color: lightblue; padding: 20px;">
        
    <header>
        <h1>Asisten AI untuk UMKM</h1>
        <h3>Selamat Datang di Website Penyewaan Transportasi</h3>
        <p>Temukan berbagai pilihan transportasi untuk kebutuhan Anda.</p>
        <img src="Transport.jpg" alt="gambar transportasi">
        <h2>Selamat Datang</h2>
        <p>Disini Tempat Penyewaan Transportasi</p>
        <p>Penyewaan Transportasi</p>
    </header>
    <nav>
        <a href="#profile">profile</a>
        <a href="#formdata">form</a>
    </nav>
    <section id="profile">
        <h2>Information Rental</h2>
        <p>Isi Form Penyewaan</p>
    </section>
    <form id="formdata" action="#">
        <label for="nama">masukkan nama lengkap</label>
        <input type="text" id="nama" name="nama">
        <fieldset id="jenis kelamin">
            <legend>jenis Transportasi</legend>
            <input type="radio" name="transportasi" id="Mobil">
            <label for="Mobil">Mobil</label>
            <input type="radio" name="transportasi" id="Motor">
            <label for="Motor">Motor</label>
        </fieldset>
        <br>
        <button type="submit">SUBMIT</button>
    </form>
